{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annotation Workbench - Job #{{ job_id }}</title>

    {# [核心] 引用 Vite 构建后的 CSS #}
    <link rel="stylesheet" href="{% static 'css/bundles/annotation-workbench.css' %}">

    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
    </style>
</head>
<body>
    {% csrf_token %}

    {# [核心修复] 使用 json_script 将数据输出到 DOM 元素中 #}
    {# Django 会自动处理 HTML 转义，防止 XSS 和 SyntaxError #}
    {{ server_data|json_script:"server-data" }}
    {{ character_list|json_script:"character-list" }}

    <script>
        // 1. 从 DOM 元素读取 JSON 内容并解析
        const serverData = JSON.parse(document.getElementById('server-data').textContent);
        const characterList = JSON.parse(document.getElementById('character-list').textContent);

        // 2. 注入全局变量
        window.SERVER_DATA = serverData;

        window.CONTEXT = {
            jobId: "{{ job_id }}",
            projectId: "{{ project_id }}",
            mediaUrl: "{{ media_url }}",
            waveformUrl: "{{ waveform_url|default:'' }}",
            returnUrl: "{{ return_url }}",

            // 注入解析后的 List
            characterList: characterList,

            csrfToken: document.querySelector('[name=csrfmiddlewaretoken]')?.value || '',
            saveEndpoint: "{% url 'workflow:annotation:annotation_save' job_id %}"
        };
    </script>

    <div id="react-root" style="height: 100vh; width: 100vw;"></div>

    <script type="module" src="{% static 'js/bundles/annotation-workbench.js' %}"></script>
</body>
</html>
