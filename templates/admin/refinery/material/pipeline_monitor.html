<div id="pipeline-app-{{ material.id }}" class="bg-gray-900 rounded-lg p-6 font-mono text-sm text-gray-300">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-blue-400 font-bold">REFINERY_PIPELINE_V1.0</h3>
        <div id="fsm-badge" class="px-2 py-1 rounded bg-blue-900 text-blue-200 text-xs">LOADING...</div>
    </div>

    <div id="steps-container" class="space-y-3">
        </div>
</div>

<script>
(function() {
    const materialId = "{{ material.id }}";
    const stateUrl = "/admin/refinery/material/" + materialId + "/pipeline-state/";
    const retryUrl = "/admin/refinery/material/" + materialId + "/retry-step/";

    function render() {
        fetch(stateUrl)
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById('steps-container');
                const badge = document.getElementById('fsm-badge');
                badge.innerText = data.fsm_status;

                container.innerHTML = data.pipeline.map(step => {
                    let icon = step.is_done ? '✅' : (step.has_error ? '❌' : (step.is_current ? '⚡' : '🔘'));
                    let border = step.has_error ? 'border-red-500' : (step.is_current ? 'border-blue-500' : 'border-gray-700');
                    let duration = step.duration ? `<span class="text-green-500">${step.duration}s</span>` : '--';

                    return `
                        <div class="flex items-center justify-between p-3 border ${border} bg-gray-800 rounded">
                            <div class="flex items-center gap-4">
                                <span class="text-lg">${icon}</span>
                                <div>
                                    <div class="font-bold text-gray-100">${step.name}</div>
                                    <div class="text-[10px] text-gray-500">ID: ${step.slug} | TIME: ${duration}</div>
                                </div>
                            </div>
                            <div>
                                ${ (step.has_error || (step.is_current && !step.is_done)) ?
                                    `<button onclick="triggerRetry('${step.slug}')" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs transition-colors">FORCE_RETRY</button>`
                                    : '' }
                            </div>
                        </div>
                        ${step.has_error ? `<div class="text-[10px] text-red-400 px-3 py-1 bg-red-900/20 mb-2 border-l-2 border-red-500">${data.pipeline.find(s=>s.slug===step.slug).error_log}</div>` : ''}
                    `;
                }).join('');
            });
    }

    window.triggerRetry = function(slug) {
        const fd = new FormData();
        fd.append('slug', slug);
        fd.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
        fetch(retryUrl, {method: 'POST', body: fd}).then(() => {
            render();
            alert("指令已下发，管线正在尝试从 " + slug + " 环节恢复...");
        });
    };

    render();
    // 自动轮询进度
    setInterval(render, 5000);
})();
</script>
