# docker-compose.base.yml
services:
  db:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai

  redis:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    expose:
      - "6379"
    environment:
      - TZ=Asia/Shanghai

  # 1. Web 容器 (Workbench 镜像)
  web:
    # 生产环境建议使用具体 tag
    image: workbench:v1.5.0-alpha
    command: gunicorn visify_ssw.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "18000:8000"
    user: appuser
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./media_root:/app/media_root
      - staticfiles_volume:/app/staticfiles
    environment:
      - TZ=Asia/Shanghai

  # 2. 通用 Worker (Workbench 镜像)
  worker:
    image: workbench:v1.5.0-alpha
    command: celery -A visify_ssw worker -l info -Q celery,default --concurrency=2
    user: appuser
    env_file:
      - .env
    depends_on:
      - web
    volumes:
      - ./media_root:/app/media_root
    environment:
      - TZ=Asia/Shanghai

  # 3. 媒体算力 Worker (Media 镜像)
  worker-media:
    image: media:v1.5.0-alpha
    # 显式指定消费 media_queue
    # [Fix] 使用 solo 池模式避免 CUDA Fork 崩溃问题
    command: celery -A visify_ssw worker -l info -Q media_queue --pool=solo
    user: appuser
    env_file:
      - .env
    depends_on:
      - web
    volumes:
      - ./media_root:/app/media_root
      # 注意：这里不需要挂载 local_models，因为它们已经烧录在镜像里了
    environment:
      - TZ=Asia/Shanghai
      # 确保 CUDA 可见
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nginx_media_server:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/nginx:1.25-alpine
    ports:
      - "9999:80"
    volumes:
      - ./media_root:/var/www/media_root:ro
      - staticfiles_volume:/var/www/staticfiles:ro
      - ./configs/nginx/vss-media-server.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai

volumes:
  postgres_data:
  staticfiles_volume: