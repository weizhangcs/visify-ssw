# docker-compose.base.yml
services:
  db:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai

  redis:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    expose:
      - "6379"
    environment:
      - TZ=Asia/Shanghai

  # 1. Web 容器 (轻量级)
  web:
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "18000:8000"
    user: root
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - ./media_root:/app/media_root
      - staticfiles_volume:/app/staticfiles
    environment:
      - TZ=Asia/Shanghai

  # 2. 通用 Worker (轻量级，处理默认队列)
  worker:
    command: celery -A visify_ssw worker -l info -Q celery,default --concurrency=2
    user: root
    env_file:
      - .env
    depends_on:
      - web
    volumes:
      - ./media_root:/app/media_root
    environment:
      - TZ=Asia/Shanghai

  # 3. [NEW] 媒体算力 Worker (重量级，处理 media_queue)
  worker-media:
    # 显式指定消费 media_queue
    command: celery -A visify_ssw worker -l info -Q media_queue --concurrency=1
    user: root
    env_file:
      - .env
    depends_on:
      - web
    volumes:
      - ./media_root:/app/media_root
    environment:
      - TZ=Asia/Shanghai

  nginx_media_server:
    image: crpi-34v4qt829vtet2cy.cn-hangzhou.personal.cr.aliyuncs.com/vss_base/nginx:1.25-alpine
    ports:
      - "9999:80"
    volumes:
      - ./media_root:/var/www/media_root:ro
      - staticfiles_volume:/var/www/staticfiles:ro
      - ./configs/nginx/vss-media-server.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai

volumes:
  postgres_data:
  staticfiles_volume: